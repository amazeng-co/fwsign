name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Reference implementation the differential test compares against.
  MCUBOOT_REF: e19ad039b4864a2a49883c8279e4a24abbbcfe84

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings

  compat:
    name: test against Python imgtool
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: mcu-tools/mcuboot
          ref: ${{ env.MCUBOOT_REF }}
          path: mcuboot
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install 'cryptography>=40' 'intelhex>=2.2.1' click cbor2 pyyaml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test
        env:
          IMGTOOL_PY: ${{ github.workspace }}/mcuboot/scripts/imgtool.py

  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - run: cargo run --release -- version

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      - run: cargo check --locked --all-targets
