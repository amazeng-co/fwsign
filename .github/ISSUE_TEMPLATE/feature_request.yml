name: Missing imgtool feature
description: An imgtool option or command that fwsign does not support yet
labels: [enhancement]
body:
  - type: input
    id: option
    attributes:
      label: Option or command
      placeholder: "--compression lzma2"
    validations:
      required: true
  - type: textarea
    id: usecase
    attributes:
      label: Use case
      description: How you use it, e.g. which Zephyr Kconfig enables it.
    validations:
      required: true
