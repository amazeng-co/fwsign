[package]
name = "imgtool-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "Apache-2.0"
description = "Drop-in Rust port of MCUboot's imgtool (sign / verify / keygen / getpub)"
repository = "https://github.com/amazeng-co/imgtool-rs"

[[bin]]
name = "imgtool"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
ed25519-dalek = { version = "2.1", features = ["pkcs8", "pem", "rand_core"] }
p256 = { version = "0.13", features = ["ecdsa", "pkcs8", "pem"] }
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"

[profile.release]
strip = true
lto = true
