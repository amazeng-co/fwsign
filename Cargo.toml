[package]
name = "imgtool-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
description = "Drop-in Rust port of MCUboot's imgtool (sign / verify / keygen / getpub)"
repository = "https://github.com/amazeng-co/imgtool-rs"

[[bin]]
name = "imgtool"
path = "src/main.rs"

[dependencies]
aes = "0.8"
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
ctr = "0.9"
ed25519-dalek = { version = "2.1", features = ["pkcs8", "pem", "rand_core"] }
hkdf = "0.12"
hmac = "0.12"
p256 = { version = "0.13", features = ["ecdsa", "pkcs8", "pem", "ecdh"] }
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }

[profile.release]
strip = true
lto = true
